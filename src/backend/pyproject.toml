[project]
name = "backend"
version = "0.1.0"
description = "CropGard sync service (JWT auth + bidirectional scan sync + Cloudinary images)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cloudinary>=1.45.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "pyjwt>=2.13.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg2-binary>=2.9.12",
]
